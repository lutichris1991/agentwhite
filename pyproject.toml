[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentwhite"
version = "0.1.0"
description = "Local-first authorized wireless and device security validation console"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AgentWhite" }]
dependencies = []

[project.optional-dependencies]
bluetooth = ["bleak>=0.22"]
build = ["pyinstaller>=6"]

[project.scripts]
agentwhite = "agentwhite.server:main"

[tool.setuptools.packages.find]
include = ["agentwhite*"]
